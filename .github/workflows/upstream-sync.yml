name: Upstream Sync

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: "Upstream repo (owner/name)"
        required: true
        default: "xiaoY233/Chat2API"
      upstream_branch:
        description: "Upstream branch"
        required: true
        default: "main"
      target_branch:
        description: "Target branch in this repository"
        required: true
        default: "main"
      sync_mode:
        description: "Merge strategy"
        required: true
        default: "merge"
        type: choice
        options:
          - merge
          - rebase

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          git remote add upstream https://github.com/${{ github.event.inputs.upstream_repo }}.git
          git fetch upstream ${{ github.event.inputs.upstream_branch }}

      - name: Sync from upstream
        id: sync
        run: |
          set -e
          if [ "${{ github.event.inputs.sync_mode }}" = "rebase" ]; then
            git rebase upstream/${{ github.event.inputs.upstream_branch }}
          else
            git merge --no-ff --no-edit upstream/${{ github.event.inputs.upstream_branch }}
          fi

      - name: Push sync result
        run: |
          git push origin HEAD:${{ github.event.inputs.target_branch }}

      - name: Summary
        run: |
          echo "Synced upstream ${{ github.event.inputs.upstream_repo }}:${{ github.event.inputs.upstream_branch }} to ${GITHUB_REPOSITORY}:${{ github.event.inputs.target_branch }} using ${{ github.event.inputs.sync_mode }}"
