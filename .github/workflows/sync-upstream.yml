name: Sync Upstream

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: Upstream repository in owner/repo format
        required: true
        default: xiaoY233/Chat2API
      upstream_branch:
        description: Upstream branch to sync from
        required: true
        default: main
      target_branch:
        description: Target branch in this repository
        required: true
        default: web

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  DEFAULT_UPSTREAM_REPO: xiaoY233/Chat2API
  DEFAULT_UPSTREAM_BRANCH: main
  DEFAULT_TARGET_BRANCH: web

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        env:
          UPSTREAM_REPO: ${{ github.event.inputs.upstream_repo || env.DEFAULT_UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || env.DEFAULT_UPSTREAM_BRANCH }}
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}" --prune

      - name: Merge upstream into sync branch
        id: merge
        env:
          UPSTREAM_REPO: ${{ github.event.inputs.upstream_repo || env.DEFAULT_UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || env.DEFAULT_UPSTREAM_BRANCH }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || env.DEFAULT_TARGET_BRANCH }}
        run: |
          set -e
          SAFE_UPSTREAM_BRANCH=$(echo "${UPSTREAM_BRANCH}" | tr '/ ' '--')
          SAFE_TARGET_BRANCH=$(echo "${TARGET_BRANCH}" | tr '/ ' '--')
          SYNC_BRANCH="sync/${SAFE_UPSTREAM_BRANCH}-to-${SAFE_TARGET_BRANCH}"
          echo "sync_branch=${SYNC_BRANCH}" >> "$GITHUB_OUTPUT"

          git checkout -B "${SYNC_BRANCH}" "origin/${TARGET_BRANCH}"

          BEFORE_SHA=$(git rev-parse HEAD)
          git merge --no-ff --no-edit "upstream/${UPSTREAM_BRANCH}"
          AFTER_SHA=$(git rev-parse HEAD)

          if [ "${BEFORE_SHA}" = "${AFTER_SHA}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes to merge"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git push -u origin "${SYNC_BRANCH}" --force-with-lease

      - name: Create or update pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || env.DEFAULT_TARGET_BRANCH }}
          UPSTREAM_REPO: ${{ github.event.inputs.upstream_repo || env.DEFAULT_UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || env.DEFAULT_UPSTREAM_BRANCH }}
          SYNC_BRANCH: ${{ steps.merge.outputs.sync_branch }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base "${TARGET_BRANCH}" \
            --head "${SYNC_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          PR_TITLE="chore: sync upstream ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}"
          PR_BODY="Automated upstream sync from ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}.\n\nPlease ensure Web Compatibility and Docker workflows are green before merging."

          if [ -n "${PR_NUMBER}" ]; then
            gh pr edit "${PR_NUMBER}" --title "${PR_TITLE}" --body "${PR_BODY}"
            echo "Updated existing PR #${PR_NUMBER}"
          else
            gh pr create \
              --base "${TARGET_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --title "${PR_TITLE}" \
              --body "${PR_BODY}"
          fi

      - name: Summary
        run: |
          if [ "${{ steps.merge.outputs.changed }}" = "true" ]; then
            echo "Upstream sync branch created: ${{ steps.merge.outputs.sync_branch }}"
            echo "Pull request created successfully."
          else
            echo "Repository is already up-to-date with upstream."
          fi
